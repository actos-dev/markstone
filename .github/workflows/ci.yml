name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Version Consistency Check
  # ============================================================================
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run version consistency check
        run: python3 scripts/check_versions.py

  # ============================================================================
  # 2. Rust Lint & Core Tests (Multi-OS)
  # ============================================================================
  lint-and-rust-tests:
    name: Rust Lint & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  # ============================================================================
  # 3. Bindings Tests & Conformance Suite
  # ============================================================================
  bindings-and-conformance:
    name: Bindings & Conformance (7 runtimes)
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 25)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false

      - name: Build C ABI & Node Addon
        run: |
          cargo build --release -p markstone-abi
          cargo build --release -p markstone-node
          cp target/release/libmarkstone_node.so bindings/node/markstone.node

      - name: Pack Native Libraries
        run: |
          python3 scripts/pack_natives.py --artifacts target/release
          python3 scripts/pack_natives.py --artifacts target/release --check

      - name: Test Python Binding
        run: |
          pip install maturin pytest
          cd bindings/python
          maturin develop
          pytest

      - name: Test Node.js Binding
        working-directory: bindings/node
        run: npm test

      - name: Test JVM Binding (Java & Kotlin)
        working-directory: bindings/jvm
        run: mvn -B test

      - name: Test .NET Binding
        run: dotnet test bindings/dotnet/tests/Markstone.Tests/Markstone.Tests.csproj

      - name: Test Go Binding
        working-directory: bindings/go
        run: go test -v ./...

      - name: Run Full Release Dry Run & Conformance
        run: bash scripts/release_dry_run.sh

  # ============================================================================
  # 4. Target Platform Compilation Matrix (9 targets from Section 7 of PLAN.md)
  # ============================================================================
  platform-matrix:
    name: Platform Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - name: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Linux aarch64
          - name: linux-aarch64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: linux-aarch64-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          # macOS
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          # Windows
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          # WebAssembly
          - name: wasm32-browser
            os: ubuntu-latest
            target: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check workspace for target
        run: cargo check --target ${{ matrix.target }} --workspace
