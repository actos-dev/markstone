# Release markstone to crates.io and npm.
#
# A `v*` tag builds, tests and publishes. Running the workflow by hand does
# everything except publishing, which makes it the dry run for a release.
#
# Published today:
#   crates.io  markstone-core, markstone-actos, markstone
#   npm        markstone (native addons for eight platforms + WebAssembly)
#
# PyPI, Maven Central, NuGet and the Go module are not released yet; see
# ROADMAP.md for what each one still needs.
#
# Secrets: CARGO_REGISTRY_TOKEN, NPM_TOKEN.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Manifest versions agree
        run: python3 scripts/check_versions.py

      - name: Read the version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "markstone-core") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the manifest version ${version}"
            exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Package the crates
        run: cargo publish --workspace --dry-run

  # One Node addon per platform. Each is tested on the platform it was built
  # for before it goes into the package.
  node-addon:
    name: Addon (${{ matrix.tag }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux-x64-gnu
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - tag: linux-arm64-gnu
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - tag: linux-x64-musl
            os: ubuntu-latest
            image: rust:1-alpine
            musl: true
          - tag: linux-arm64-musl
            os: ubuntu-24.04-arm
            image: rust:1-alpine
            musl: true
          - tag: darwin-x64
            os: macos-15-intel
            lib: libmarkstone_node.dylib
          - tag: darwin-arm64
            os: macos-latest
            lib: libmarkstone_node.dylib
          - tag: win32-x64
            os: windows-latest
            lib: markstone_node.dll
          - tag: win32-arm64
            os: windows-11-arm
            lib: markstone_node.dll
    steps:
      - uses: actions/checkout@v4

      # Linux addons are built in containers: glibc 2.28 is the floor Node 18
      # itself requires, and musl needs a dynamically linked libc to be
      # loadable as an addon.
      - name: Build (glibc)
        if: matrix.image && !matrix.musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" bash -euc '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked -p markstone-node
          '
          cp target/release/libmarkstone_node.so "bindings/node/markstone.${{ matrix.tag }}.node"

      - name: Build (musl)
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            "${{ matrix.image }}" sh -euc '
              apk add --no-cache musl-dev
              cargo build --release --locked -p markstone-node
            '
          cp target/release/libmarkstone_node.so "bindings/node/markstone.${{ matrix.tag }}.node"

      - name: Install Rust
        if: "!matrix.image"
        uses: dtolnay/rust-toolchain@stable

      - name: Build (native)
        if: "!matrix.image"
        shell: bash
        run: |
          cargo build --release --locked -p markstone-node
          cp "target/release/${{ matrix.lib }}" "bindings/node/markstone.${{ matrix.tag }}.node"

      - name: Test (musl)
        if: matrix.musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src/bindings/node node:22-alpine \
            node --test test/index.test.js

      - uses: actions/setup-node@v4
        if: "!matrix.musl"
        with:
          node-version: "22"

      - name: Test
        if: "!matrix.musl"
        working-directory: bindings/node
        run: node --test test/index.test.js

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.tag }}
          path: bindings/node/markstone.${{ matrix.tag }}.node
          if-no-files-found: error

  wasm:
    name: WebAssembly
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build
        run: |
          wasm-pack build bindings/wasm --release --target web --out-dir ../node/wasm
          rm -f bindings/node/wasm/.gitignore

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: bindings/node/wasm/
          if-no-files-found: error

  npm-package:
    name: npm package
    needs: [verify, node-addon, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          merge-multiple: true
          path: bindings/node

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: bindings/node/wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Every platform is present
        working-directory: bindings/node
        run: |
          for tag in linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl \
                     darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            test -s "markstone.${tag}.node" || { echo "::error::Missing addon for ${tag}"; exit 1; }
          done

      # The native/WebAssembly parity test now runs against the fresh build.
      - name: Test
        working-directory: bindings/node
        run: node --test test/index.test.js

      - name: Pack
        working-directory: bindings/node
        run: |
          npm pack
          tar -tzf markstone-*.tgz | sort

      # Install the tarball the way a user would, on glibc and on musl, and
      # once with the addon removed to exercise the WebAssembly fallback.
      - name: Install and import
        run: |
          tarball="$(ls "$PWD"/bindings/node/markstone-*.tgz)"
          cat > smoke.mjs <<'EOF'
          import { toHtml, actos } from 'markstone';
          const html = toHtml('**bold** <script>x</script>');
          const linked = actos.toHtml('@deniz #rust');
          if (html !== '<p><strong>bold</strong> x</p>\n') throw new Error(`toHtml: ${JSON.stringify(html)}`);
          if (!linked.includes('href="/u/deniz"')) throw new Error(`actos.toHtml: ${linked}`);
          console.log('ok', process.platform, process.arch);
          EOF
          mkdir smoke && cd smoke
          npm init -y > /dev/null
          npm install "$tarball"
          cp ../smoke.mjs .
          node smoke.mjs
          docker run --rm -v "$PWD:/app" -w /app node:22-alpine node smoke.mjs
          rm node_modules/markstone/markstone.*.node
          node smoke.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/node/markstone-*.tgz
          if-no-files-found: error

  publish-crates:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, npm-package]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Crate by crate, in dependency order, skipping versions that are
      # already up so that a failed release can be re-run.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for crate in markstone-core markstone-actos markstone; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'markstone-release (github.com/actos-dev/markstone)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            if [ "$status" = "200" ]; then
              echo "${crate} ${VERSION} is already published"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, npm-package]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "markstone@${VERSION}" version > /dev/null 2>&1; then
            echo "markstone ${VERSION} is already published"
          else
            npm publish markstone-*.tgz --provenance --access public
          fi

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" markstone-*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
